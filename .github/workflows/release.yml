name: Build and Release v1.0.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dkarrow-v1-release
  cancel-in-progress: true

env:
  VERSION: 1.0.1
  PROJECT: DKArrowEzDrawingTool.csproj
  RID: win-x64

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:PROJECT

      - name: Build
        shell: pwsh
        run: dotnet build $env:PROJECT -c Release --no-restore

      - name: Publish Windows x64 self-contained
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT `
            -c Release `
            -r $env:RID `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $binaryZip = "DK-Arrow-Ez-Drawing-Tool-v$env:VERSION-win-x64.zip"
          $sourceZip = "DK-Arrow-Ez-Drawing-Tool-v$env:VERSION-source.zip"
          Compress-Archive -Path "publish\*" -DestinationPath "artifacts\$binaryZip" -CompressionLevel Optimal -Force
          git archive --format=zip --output="artifacts\$sourceZip" HEAD
          "BINARY_ZIP=$binaryZip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SOURCE_ZIP=$sourceZip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DK-Arrow-Ez-Drawing-Tool-v1.0.1
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $binary = "artifacts\$env:BINARY_ZIP"
          $source = "artifacts\$env:SOURCE_ZIP"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $binary $source --clobber
            gh release edit $tag --title "DK Arrow Ez Drawing Tool $tag" --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag $binary $source --target "$env:GITHUB_SHA" --title "DK Arrow Ez Drawing Tool $tag" --notes-file RELEASE_NOTES.md
          }
